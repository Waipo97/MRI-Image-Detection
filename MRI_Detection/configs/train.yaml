# One configuration shared by BOTH models (baseline and improved), so the comparison is controlled.
seed: 0

dataset:
  raw_zip: data/raw/archive.zip
  raw_dir: data/raw
  yolo_dir: data/yolo
  split: {train: 0.70, val: 0.20, test: 0.10}   # stratified by class, duplicates kept together

train:
  epochs: 150
  imgsz: 640
  batch: 16
  patience: 40
  workers: 2
  device: auto            # auto -> GPU 0 if CUDA is available, else CPU
  deterministic: true
  cache: ram              # the images fit in RAM, epochs run faster
  multi_scale: false
  # optimizer / schedule
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  # localisation-focused loss gains
  box: 8.0
  cls: 0.5
  dfl: 2.0
  # explicit MRI-oriented augmentation (no automatic policy)
  degrees: 7.0
  translate: 0.03
  scale: 0.08
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  auto_augment: null
  close_mosaic: 0

# QUICK_TEST overrides (laptop / CPU sanity run)
quick:
  epochs: 3
  imgsz: 320
  batch: 8
  fraction: 0.25
  patience: 40
  workers: 0
  cache: false
